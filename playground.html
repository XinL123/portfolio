    <!-- theme boot, BEFORE first paint. The choice survives navigation inside
         the site (home -> about -> playground ...) but NOT a reload: a reload
         restarts the site from the intro lines, so it opens light, matching the
         rest of the reload-resets-everything behaviour. -->
    <script>
      (function () {
        var t = "light";
        try {
          var nav = performance.getEntriesByType("navigation")[0];
          /* a reload starts the whole site over -> forget the choice */
          if (nav && nav.type === "reload") sessionStorage.removeItem("portfolio-theme");
          if (sessionStorage.getItem("portfolio-theme") === "dark") t = "dark";
        } catch (e) {
          /* storage blocked (private mode) — keep the light default */
        }
        document.documentElement.dataset.theme = t;
      })();
    </script>

    <script>
      // Playground game carousel: the arrows page between the featured games.
      // Cards show static covers (no live game embeds — they overloaded the page);
      // a game without a cover yet falls back to a lazy iframe only while shown.
      (function () {
        var GAMES = [
          { title: "Mercury Voice", url: "https://xinl123.github.io/Mercury-Voice/", cover: "assets/playground/covers/mercury-voice-cover.jpg?v=20260816" },
          { title: "Dog Fetch Game", url: "https://xinl123.github.io/Dog-Fetch-Game/", cover: "assets/playground/covers/dog-fetch-cover.jpg?v=20260816" },
        ];
        var index = 0;
        var feature = document.querySelector(".game-feature");
        var frameBox = feature && feature.querySelector(".game-frame");
        var title = document.getElementById("game-heading");
        if (!feature || !frameBox || !title) return;
        // Pre-load every cover so the cross-fade never fades into a blank frame.
        GAMES.forEach(function (g) { if (g.cover) { var im = new Image(); im.src = g.cover; } });
        function show(n) {
          index = ((n % GAMES.length) + GAMES.length) % GAMES.length;
          var g = GAMES[index];
          feature.href = g.url;
          feature.setAttribute("aria-label", "Open " + g.title + " in a new tab");
          // Cross-fade: the old layer fades out on top while the new one fades
          // in beneath it — pure CSS animations, cleaned up on the next switch.
          frameBox.querySelectorAll(".leaving").forEach(function (e) { e.remove(); });
          var old = frameBox.querySelector("img.game-cover, iframe");
          if (old) {
            old.classList.remove("arriving"); // else its fade-in rule outranks the fade-out
            old.classList.add("leaving");
          }
          var el;
          if (g.cover) {
            el = document.createElement("img");
            el.className = "game-cover arriving";
            el.src = g.cover;
            el.alt = g.title + " cover";
          } else {
            el = document.createElement("iframe");
            el.className = "arriving";
            el.src = g.url;
            el.title = g.title + " preview";
            el.loading = "lazy";
          }
          frameBox.insertBefore(el, frameBox.querySelector(".game-open-cue"));
          title.textContent = g.title;
          title.classList.remove("arriving");
          void title.offsetWidth;                        // restart the title fade
          title.classList.add("arriving");
        }
        document.querySelector(".game-nav-prev").addEventListener("click", function () { show(index - 1); });
        document.querySelector(".game-nav-next").addEventListener("click", function () { show(index + 1); });
      })();
    </script>

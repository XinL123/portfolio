<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Chushubao · AI Writing Demo</title>
<style>
  /* preview page only — the component itself is everything inside .cbd.
     Background is transparent so the file can be dropped into an <iframe> on
     any page (light or dark) and only the phone shows; standalone it just
     renders the phone on the browser's default white. */
  html, body { margin: 0; padding: 0; background: transparent; min-height: 100vh; }
  body { display: grid; place-items: center; box-sizing: border-box; }

  /* ================= 出书宝 looping interaction demo =================
     Self-contained component. All classes prefixed cbd-. The screen is
     designed at 402x852 (matches the Figma prototype frame) inside a thin
     bezel, and the whole phone scales to fit its wrapper. */

  .cbd {
    --cbd-red: #C8392E;
    --cbd-ink: #1F1F22;
    --cbd-gray: #8A8A8E;
    --cbd-fill: #ECEDF1;
    --cbd-screen: #FFFFFF; /* pure white screen — no grey tint in the corners */
    --cbd-blue: #0088FF;
    width: min(400px, 100%);
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC", "Helvetica Neue", "Microsoft YaHei", sans-serif;
    -webkit-font-smoothing: antialiased;
    user-select: none;
  }
  .cbd, .cbd * { box-sizing: border-box; }

  /* scale stage: phone is fixed 424x874 (402x852 screen + bezel), wrapper scales it */
  .cbd-stage { position: relative; width: 100%; }
  /* ---- iPhone product-mockup frame (per the user's reference shots) ----
     Anatomy, outside in: side buttons poking out of a machined-metal rim
     (subtle silver gradient + hairline edges), then a black display surround,
     then the screen. Identical in the site's light AND dark themes — no
     theme-dependent overrides. No drop shadow (soft grey shadows read as
     corner residue on the white page). */
  .cbd-phone {
    position: absolute; top: 0; left: 0;
    width: 424px; height: 874px;
    transform-origin: top left;
    /* machined titanium rim: light catches the top and bottom edges */
    background: linear-gradient(175deg, #e9eaec 0%, #c2c3c8 18%, #aeafb5 50%, #c6c7cc 82%, #eff0f2 100%);
    border: 1px solid #94959b;
    border-radius: 58px;
    padding: 4px;                       /* rim thickness */
    box-shadow: inset 0 0 1.5px rgba(255,255,255,.9); /* inner machined highlight */
  }
  .cbd-screenwrap {
    position: relative; width: 100%; height: 100%;
    border-radius: 54px; overflow: hidden;
    background: var(--cbd-screen);
    border: 9px solid #0b0b0d;          /* the black display surround */
    display: flex; flex-direction: column;
  }
  /* side buttons: volume pair + action on the left, power on the right —
     darker metal pills tucked 1px under the rim so they read as attached */
  .cbd-btn {
    position: absolute; width: 5px; border-radius: 2.5px;
    background: linear-gradient(90deg, #85868c, #b4b5ba 55%, #9b9ca1);
  }
  .cbd-btn-action { left: -4px; top: 152px; height: 30px; }
  .cbd-btn-volup  { left: -4px; top: 210px; height: 52px; }
  .cbd-btn-voldn  { left: -4px; top: 272px; height: 52px; }
  .cbd-btn-power  { right: -4px; top: 238px; height: 84px;
    background: linear-gradient(270deg, #85868c, #b4b5ba 55%, #9b9ca1); }

  /* ---- status bar ---- */
  .cbd-status {
    flex: none; height: 56px; position: relative;
    display: flex; align-items: flex-end; justify-content: space-between;
    padding: 0 36px 8px 44px;
  }
  .cbd-time { font-size: 17px; font-weight: 600; color: #000; letter-spacing: .2px; }
  .cbd-island {
    position: absolute; top: 11px; left: 50%; transform: translateX(-50%);
    width: 126px; height: 37px; border-radius: 24px; background: #000;
  }
  .cbd-statmix { display: flex; align-items: center; gap: 7px; }
  .cbd-statmix svg { display: block; }

  /* ---- nav : back + segmented ---- */
  .cbd-nav { flex: none; height: 64px; position: relative; display: flex; align-items: center; justify-content: center; }
  .cbd-back { position: absolute; left: 28px; top: 50%; transform: translateY(-50%); }
  .cbd-seg {
    display: flex; align-items: center;
    background: var(--cbd-fill); border-radius: 999px; padding: 3px; height: 47px; width: 209px;
  }
  .cbd-seg span {
    display: flex; align-items: center; justify-content: center;
    height: 41px; border-radius: 999px;
    font-size: 20px; color: var(--cbd-gray); font-weight: 500; letter-spacing: .14px;
  }
  .cbd-seg .cbd-seg-on {
    width: 113px; flex: none;
    background: #fff; color: var(--cbd-red); font-weight: 600;
    box-shadow: 0 1px 2px rgba(20,20,22,.05);
  }
  .cbd-seg span:not(.cbd-seg-on) { flex: 1; }

  /* ---- chat scroll ---- */
  .cbd-chat {
    flex: 1 1 auto; min-height: 0;
    overflow: hidden; position: relative;
    transition: opacity .45s ease;
  }
  .cbd-chat.cbd-fade { opacity: 0; }
  .cbd-scroll {
    position: absolute; inset: 0;
    overflow-y: auto; scrollbar-width: none;
    padding: 22px 24px 20px;
  }
  .cbd-scroll::-webkit-scrollbar { display: none; }
  .cbd-scroll > * + * { margin-top: 35px; }

  .cbd-msg-in { animation: cbd-rise .42s cubic-bezier(.2,.9,.3,1) both; }
  @keyframes cbd-rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }

  .cbd-bubble {
    margin-left: auto; max-width: 277px; width: fit-content;
    background: var(--cbd-fill); border-radius: 20px 20px 6px 20px;
    padding: 11px 15px; font-size: 18px; line-height: 28px; color: #000;
  }

  .cbd-ailabel { display: flex; align-items: center; gap: 7px; font-size: 14px; font-weight: 500; letter-spacing: .5px; color: var(--cbd-gray); }
  .cbd-spark { display: flex; align-items: center; }
  .cbd-spark svg { display: block; }
  /* thinking glyph: dot-bar-dot pulsing */
  .cbd-think { display: flex; align-items: center; gap: 3px; }
  .cbd-think i { display: block; background: var(--cbd-red); border-radius: 3px; }
  .cbd-think i:nth-child(1) { width: 6px; height: 6px; animation: cbd-blink 1s ease-in-out infinite; }
  .cbd-think i:nth-child(2) { width: 6px; height: 14px; animation: cbd-blink 1s ease-in-out .18s infinite; }
  .cbd-think i:nth-child(3) { width: 6px; height: 6px; animation: cbd-blink 1s ease-in-out .36s infinite; }
  @keyframes cbd-blink { 0%,100% { transform: scaleY(.55); opacity: .55; } 50% { transform: scaleY(1); opacity: 1; } }

  /* skeleton shimmer */
  .cbd-skel { margin-top: 14px; overflow: hidden; max-height: 200px; transition: max-height .4s ease, opacity .3s ease; }
  .cbd-skel.cbd-gone { max-height: 0; opacity: 0; margin-top: 0; }
  .cbd-skel i {
    display: block; height: 17px; border-radius: 9px; margin-bottom: 14px;
    background: linear-gradient(100deg, #e7e8ec 30%, #f0f1f4 46%, #f3f4f6 52%, #e7e8ec 68%);
    background-size: 240% 100%;
    animation: cbd-shimmer 1.6s linear infinite;
  }
  @keyframes cbd-shimmer { from { background-position: 130% 0; } to { background-position: -110% 0; } }

  .cbd-paras p { margin: 20px 0 0; font-size: 18px; line-height: 33.3px; letter-spacing: .18px; color: var(--cbd-ink); }
  .cbd-paras p:first-child { margin-top: 12px; }
  .cbd-paras p:empty { margin: 0; }

  .cbd-acts { display: flex; align-items: center; gap: 20px; margin-top: 14px; height: 24px; opacity: 0; transition: opacity .5s ease; }
  .cbd-acts.cbd-on { opacity: 1; }
  .cbd-acts svg { display: block; }

  /* ---- dock : chips + input ---- */
  .cbd-dock {
    flex: none; padding: 4px 20px 31px; position: relative; z-index: 6;
    transition: padding-bottom .38s cubic-bezier(.32,.72,.34,1);
  }
  .cbd-chiprow {
    display: flex; gap: 7px; margin: 0 0 10px; height: 36px;
    overflow: hidden;
    transition: height .25s ease, margin-bottom .25s ease, opacity .16s ease;
  }
  .cbd-dock.cbd-hidechips { padding-bottom: 10px; }
  .cbd-dock.cbd-hidechips .cbd-chiprow { height: 0; margin-bottom: 0; opacity: 0; }
  .cbd-chip {
    display: flex; align-items: center; gap: 6px;
    background: #fff; border-radius: 999px; height: 36px; padding: 0 12px;
    font-size: 13px; color: var(--cbd-ink); white-space: nowrap;
    box-shadow: inset 0 0 0 1px var(--cbd-fill);
    animation: cbd-chip-in .4s cubic-bezier(.2,.9,.3,1) both;
  }
  @keyframes cbd-chip-in { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
  .cbd-chip svg { flex: none; }

  /* input pill — expands into a tall card when an image is attached */
  .cbd-inputbar {
    background: var(--cbd-fill); border-radius: 28px;
    display: flex; flex-direction: column;
    transition: border-radius .3s ease;
  }
  .cbd-inputbar.cbd-expanded { border-radius: 26px; }
  .cbd-attach {
    display: flex; padding: 0 10px; height: 0; overflow: visible;
    transition: height .35s cubic-bezier(.3,.9,.35,1), padding-top .35s cubic-bezier(.3,.9,.35,1);
  }
  .cbd-inputbar.cbd-expanded .cbd-attach { height: 77px; padding-top: 10px; }
  .cbd-thumb {
    position: relative; width: 67px; height: 67px; border-radius: 14px; background: #fff;
    box-shadow: 0 1px 3px rgba(20,20,22,.08), 0 0 0 1px rgba(20,20,22,.06);
    transform: scale(.3); opacity: 0;
    transition: transform .35s cubic-bezier(.34,1.35,.5,1), opacity .25s ease;
  }
  .cbd-inputbar.cbd-expanded .cbd-thumb { transform: scale(1); opacity: 1; }
  .cbd-thumb > svg.cbd-sketch { position: absolute; inset: 0; border-radius: 14px; }
  .cbd-thumb-x {
    position: absolute; top: 4.5px; right: 4.5px; width: 18px; height: 18px;
    border-radius: 999px; background: rgba(31,31,34,.72);
    display: grid; place-items: center;
  }
  .cbd-inputrow {
    height: 56px; flex: none;
    display: flex; align-items: center; padding: 0 11px 0 16px; gap: 13px;
  }
  .cbd-plus { flex: none; display: grid; place-items: center; width: 24px; }
  .cbd-field { flex: 1; min-width: 0; font-size: 16px; color: #9A9A9E; line-height: 1.3; white-space: nowrap; overflow: hidden; }
  .cbd-field.cbd-filled { color: var(--cbd-ink); }
  .cbd-caret { display: inline-block; width: 2px; height: 18px; background: var(--cbd-blue); vertical-align: -3px; margin-left: 1px; opacity: 0; }
  .cbd-caret.cbd-on { animation: cbd-caret 1s steps(2) infinite; }
  @keyframes cbd-caret { 0% { opacity: 1; } 50% { opacity: 0; } 100% { opacity: 1; } }
  .cbd-voicebtn {
    flex: none; width: 34px; height: 34px; border-radius: 999px; background: var(--cbd-screen);
    display: grid; place-items: center;
  }
  .cbd-send {
    flex: none; width: 34px; height: 34px; border-radius: 999px; background: var(--cbd-red);
    display: grid; place-items: center;
    /* hidden: tucked fully behind the voice circle, scaled away; shown: slides
       out to sit 10px right of it. Fixed width so it stays a circle throughout. */
    transform: scale(0); margin-left: -47px;
    transition: transform .3s cubic-bezier(.34,1.4,.5,1), margin-left .3s cubic-bezier(.34,1.4,.5,1);
  }
  .cbd-send.cbd-on { transform: scale(1); margin-left: -3px; }
  .cbd-send svg { flex: none; }

  /* voice recording bar : [stop circle] [pill with right-aligned waves + send] */
  .cbd-voicerow { display: none; align-items: center; gap: 11px; }
  .cbd-voicerow.cbd-on { display: flex; }
  .cbd-stopbtn {
    flex: none; width: 56px; height: 56px; border-radius: 999px; background: var(--cbd-fill);
    display: grid; place-items: center;
  }
  .cbd-stopbtn i { display: block; width: 16px; height: 16px; border-radius: 4px; background: #B4B4B8; }
  .cbd-wavepill {
    flex: 1; height: 56px; border-radius: 999px; background: var(--cbd-fill);
    display: flex; align-items: center; justify-content: flex-end; gap: 10px; padding: 0 6px 0 14px;
  }
  .cbd-waves { display: flex; align-items: center; gap: 3px; overflow: hidden; }
  .cbd-waves i {
    flex: none; display: block; width: 3px; border-radius: 3px; background: #C4C4C9;
    height: 8px; animation: cbd-wave 1s ease-in-out infinite;
  }
  @keyframes cbd-wave { 0%,100% { transform: scaleY(.5); } 50% { transform: scaleY(1); } }
  .cbd-voicerow .cbd-vsend {
    flex: none; width: 34px; height: 34px; border-radius: 999px; background: var(--cbd-red);
    display: grid; place-items: center;
  }

  /* switch between normal input and voice bar */
  .cbd-inputswap { position: relative; }
  .cbd-inputswap .cbd-inputbar { transition: opacity .18s ease, border-radius .3s ease; }
  .cbd-inputswap.cbd-recording .cbd-inputbar { opacity: 0; pointer-events: none; position: absolute; inset: 0; }

  /* ---- keyboard ---- */
  .cbd-kbspacer { flex: none; height: 0; transition: height .38s cubic-bezier(.32,.72,.34,1); }
  .cbd-kbspacer.cbd-open { height: 314px; }
  .cbd-kb {
    position: absolute; left: 0; right: 0; bottom: 0; height: 314px; z-index: 10;
    background: #d2d4da;
    transform: translateY(102%);
    transition: transform .38s cubic-bezier(.32,.72,.34,1);
    padding: 0 8.5px;
  }
  .cbd-kb.cbd-open { transform: translateY(0); }
  .cbd-kb-pred { display: flex; height: 46px; align-items: stretch; margin: 0 -8.5px 4px; }
  .cbd-kb-pred span { flex: 1; display: grid; place-items: center; font-size: 17px; color: #1A1A1A; position: relative; }
  .cbd-kb-pred span + span::before { content: ""; position: absolute; left: 0; top: 11px; bottom: 11px; width: 1px; background: rgba(60,60,67,.22); }
  .cbd-kb-row { display: flex; gap: 6px; margin-bottom: 11px; }
  .cbd-kb-row.cbd-kb-mid { padding: 0 20px; }
  .cbd-key {
    flex: 1; height: 45px; border-radius: 8.5px; background: #fff;
    box-shadow: 0 1px 0 #898a8d; display: grid; place-items: center;
    font-size: 23px; color: #1c1c1e; font-weight: 300;
    transition: background .06s;
  }
  .cbd-key.cbd-hit { background: #c9cbd1; }
  .cbd-key-fn { background: #abafb9; flex: none; width: 45px; font-size: 15px; }
  .cbd-key-abc { flex: none; width: 91.67px; height: 45px; border-radius: 8.5px; background: #abafb9; box-shadow: 0 1px 0 #898a8d; display: grid; place-items: center; font-size: 16px; color: #1c1c1e; }
  .cbd-key-space { flex: 1; height: 45px; border-radius: 8.5px; background: #fff; box-shadow: 0 1px 0 #898a8d; }
  .cbd-key-ret { flex: none; width: 92px; height: 45px; border-radius: 8.5px; background: var(--cbd-blue); box-shadow: 0 1px 0 #898a8d; display: grid; place-items: center; }
  .cbd-kb-foot { display: flex; justify-content: space-between; align-items: center; padding: 10px 30px 0; }

  /* ---- upload menu (matches the Figma component: 215w, fill card, circles) ---- */
  .cbd-menu {
    position: absolute; left: 20px; bottom: 31px; z-index: 12;
    width: 215px; border-radius: 30px; background: var(--cbd-fill);
    box-shadow: 0 0 0 1px #fff inset, -2px 12px 30px rgba(0,0,0,.14), 0 -2px 20px rgba(0,0,0,.05);
    padding: 8px;
    transform-origin: 18% 100%;
    transform: scale(.35); opacity: 0; pointer-events: none;
    transition: transform .32s cubic-bezier(.34,1.3,.5,1), opacity .22s ease;
  }
  .cbd-menu.cbd-open { transform: scale(1); opacity: 1; }
  .cbd-menu-row { display: flex; align-items: center; gap: 20px; padding: 11px 12px; border-radius: 16px; transition: background .15s; }
  .cbd-menu-row + .cbd-menu-row { margin-top: 7px; }
  .cbd-menu-row.cbd-hit { background: rgba(255,255,255,.75); }
  .cbd-menu-ic { flex: none; width: 54px; height: 54px; border-radius: 999px; background: #F1F1F4; display: grid; place-items: center; }
  .cbd-menu-row b { font-size: 20px; font-weight: 400; color: var(--cbd-ink); }

  /* ---- home indicator / tap dot ---- */
  .cbd-home {
    position: absolute; bottom: 10px; left: 50%; transform: translateX(-50%);
    width: 139px; height: 5px; border-radius: 100px; background: #1f1f21; z-index: 20;
  }
  .cbd-tap {
    position: absolute; z-index: 30; width: 40px; height: 40px; border-radius: 20px;
    background: rgba(40,40,44,.18); border: 1.5px solid rgba(40,40,44,.22);
    transform: translate(-50%,-50%) scale(.4); opacity: 0; pointer-events: none;
  }
  .cbd-tap.cbd-on { animation: cbd-tapdot .5s ease-out both; }
  @keyframes cbd-tapdot {
    0% { opacity: 0; transform: translate(-50%,-50%) scale(.4); }
    25% { opacity: 1; transform: translate(-50%,-50%) scale(1); }
    100% { opacity: 0; transform: translate(-50%,-50%) scale(1.25); }
  }
</style>
</head>
<body>

<div class="cbd" id="cbdRoot">
  <div class="cbd-stage" id="cbdStage">
    <div class="cbd-phone" id="cbdPhone">
      <!-- physical side buttons (product-mockup frame) -->
      <div class="cbd-btn cbd-btn-action"></div>
      <div class="cbd-btn cbd-btn-volup"></div>
      <div class="cbd-btn cbd-btn-voldn"></div>
      <div class="cbd-btn cbd-btn-power"></div>
      <div class="cbd-screenwrap" id="cbdScreen">

        <!-- status bar -->
        <div class="cbd-status">
          <span class="cbd-time">9:41</span>
          <div class="cbd-island"></div>
          <div class="cbd-statmix">
            <svg width="19" height="12" viewBox="0 0 19 12" fill="#000"><rect x="0" y="7.5" width="3.2" height="4.5" rx="1"/><rect x="4.8" y="5" width="3.2" height="7" rx="1"/><rect x="9.6" y="2.5" width="3.2" height="9.5" rx="1"/><rect x="14.4" y="0" width="3.2" height="12" rx="1"/></svg>
            <svg width="17" height="12" viewBox="0 0 17 12" fill="none" stroke="#000" stroke-width="1.7" stroke-linecap="round"><path d="M1.5 4.2a10.5 10.5 0 0 1 14 0"/><path d="M4.2 7a6.7 6.7 0 0 1 8.6 0"/><path d="M6.9 9.7a2.9 2.9 0 0 1 3.2 0"/><circle cx="8.5" cy="10.6" r="1" fill="#000" stroke="none"/></svg>
            <svg width="27" height="13" viewBox="0 0 27 13"><rect x="0.5" y="0.5" width="23" height="12" rx="3.5" fill="none" stroke="#000" stroke-opacity=".35"/><rect x="2" y="2" width="20" height="9" rx="2" fill="#000"/><path d="M25 4.5v4a2.2 2.2 0 0 0 0-4z" fill="#000" fill-opacity=".4"/></svg>
          </div>
        </div>

        <!-- nav -->
        <div class="cbd-nav">
          <svg class="cbd-back" width="9" height="16" viewBox="0 0 9 16" fill="none" stroke="#8A8A8E" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7.7 1.3 1.3 8l6.4 6.7"/></svg>
          <div class="cbd-seg"><span class="cbd-seg-on">AI 写书</span><span>聊聊</span></div>
        </div>

        <!-- chat -->
        <div class="cbd-chat" id="cbdChat">
          <div class="cbd-scroll" id="cbdScroll"></div>
        </div>

        <!-- dock -->
        <div class="cbd-dock">
          <div class="cbd-chiprow" id="cbdChips"></div>
          <div class="cbd-inputswap" id="cbdSwap">
            <div class="cbd-inputbar" id="cbdBar">
              <div class="cbd-attach" id="cbdAttach">
                <div class="cbd-thumb" id="cbdThumb">
                  <svg class="cbd-sketch" viewBox="0 0 67 67">
                    <rect width="67" height="67" rx="14" fill="#fdfdfd"/>
                    <path d="M9 44 C 19 21, 35 16, 44 26 C 50 33, 42 41, 36 37 C 31 33, 37 25, 47 23" fill="none" stroke="#c8392e" stroke-width="2" stroke-linecap="round"/>
                    <path d="M46 24 58 18" stroke="#5a5a5e" stroke-width="1.8" stroke-linecap="round"/>
                    <circle cx="58" cy="18" r="1.5" fill="#5a5a5e"/>
                  </svg>
                  <div class="cbd-thumb-x"><svg width="9" height="9" viewBox="0 0 9 9" stroke="#fff" stroke-width="1.4" stroke-linecap="round"><path d="M1.4 1.4 7.6 7.6M7.6 1.4 1.4 7.6"/></svg></div>
                </div>
              </div>
              <div class="cbd-inputrow">
                <div class="cbd-plus" id="cbdPlus"><svg width="16" height="16" viewBox="0 0 16 16" stroke="#8A8A8E" stroke-width="1.8" stroke-linecap="round"><path d="M8 1.5v13M1.5 8h13"/></svg></div>
                <div class="cbd-field" id="cbdField">写点什么…<span class="cbd-caret" id="cbdCaret"></span></div>
                <div class="cbd-voicebtn" id="cbdVoiceBtn"><svg width="19" height="15" viewBox="0 0 19 15" fill="none" stroke="#8A8A8E" stroke-width="1.7" stroke-linecap="round"><circle cx="5.4" cy="7.5" r="1.2" fill="#8A8A8E" stroke="none"/><path d="M9.4 3.7a5.7 5.7 0 0 1 0 7.6"/><path d="M12.8 1.2a9.8 9.8 0 0 1 0 12.6"/></svg></div>
                <div class="cbd-send" id="cbdSend"><svg width="13" height="15" viewBox="0 0 13 15" fill="none" stroke="#fff" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M6.5 13.5V1.8M1.6 6.2 6.5 1.4l4.9 4.8"/></svg></div>
              </div>
            </div>
            <div class="cbd-voicerow" id="cbdVoiceRow">
              <div class="cbd-stopbtn"><i></i></div>
              <div class="cbd-wavepill">
                <div class="cbd-waves" id="cbdWave"></div>
                <div class="cbd-vsend"><svg width="13" height="15" viewBox="0 0 13 15" fill="none" stroke="#fff" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M6.5 13.5V1.8M1.6 6.2 6.5 1.4l4.9 4.8"/></svg></div>
              </div>
            </div>
          </div>
        </div>

        <!-- keyboard -->
        <div class="cbd-kbspacer" id="cbdKbSpacer"></div>
        <div class="cbd-kb" id="cbdKb">
          <div class="cbd-kb-pred"><span>&ldquo;The&rdquo;</span><span>the</span><span>to</span></div>
          <div class="cbd-kb-row" data-row="qwertyuiop"></div>
          <div class="cbd-kb-row cbd-kb-mid" data-row="asdfghjkl"></div>
          <div class="cbd-kb-row" id="cbdKbRow3">
            <div class="cbd-key cbd-key-fn"><svg width="18" height="16" viewBox="0 0 18 16" fill="none" stroke="#1c1c1e" stroke-width="1.5" stroke-linejoin="round"><path d="M9 1 2 8.2h3.5V13h7V8.2H16Z"/></svg></div>
            <div class="cbd-keys-mid" style="display:flex;gap:6px;flex:1" data-row="zxcvbnm"></div>
            <div class="cbd-key cbd-key-fn"><svg width="21" height="15" viewBox="0 0 21 15" fill="none" stroke="#1c1c1e" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"><path d="M6.5 1h12.2a1.3 1.3 0 0 1 1.3 1.3v10.4a1.3 1.3 0 0 1-1.3 1.3H6.5L1 7.5Z"/><path d="m9.5 4.8 5.4 5.4m0-5.4-5.4 5.4"/></svg></div>
          </div>
          <div class="cbd-kb-row">
            <div class="cbd-key-abc">ABC</div>
            <div class="cbd-key-space"></div>
            <div class="cbd-key-ret"><svg width="19" height="16" viewBox="0 0 19 16" fill="none" stroke="#fff" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M16.5 2v5.5a2 2 0 0 1-2 2H3"/><path d="M7 5.5 3 9.5 7 13.5"/></svg></div>
          </div>
          <div class="cbd-kb-foot">
            <svg width="26" height="26" viewBox="0 0 26 26" fill="none" stroke="#50525c" stroke-width="1.6" stroke-linecap="round"><circle cx="13" cy="13" r="10.4"/><path d="M8.6 15.4a5.6 5.6 0 0 0 8.8 0"/><circle cx="9.4" cy="10.4" r="1" fill="#50525c" stroke="none"/><circle cx="16.6" cy="10.4" r="1" fill="#50525c" stroke="none"/></svg>
            <svg width="20" height="27" viewBox="0 0 20 27" fill="none" stroke="#50525c" stroke-width="1.6" stroke-linecap="round"><rect x="6.2" y="1.5" width="7.6" height="13.5" rx="3.8"/><path d="M2 12.2a8 8 0 0 0 16 0M10 20.5V25M6 25h8"/></svg>
          </div>
        </div>

        <!-- upload menu -->
        <div class="cbd-menu" id="cbdMenu">
          <div class="cbd-menu-row" data-item="camera">
            <div class="cbd-menu-ic"><svg width="26" height="23" viewBox="0 0 26 23" fill="none" stroke="#000" stroke-width="1.5" stroke-linejoin="round"><path d="M1.7 7A2.4 2.4 0 0 1 4.1 4.6h3.3l2-2.7h7.2l2 2.7h3.3A2.4 2.4 0 0 1 24.3 7v12a2.4 2.4 0 0 1-2.4 2.4H4.1A2.4 2.4 0 0 1 1.7 19Z"/><circle cx="13" cy="12.6" r="4.7"/></svg></div>
            <b>拍照</b>
          </div>
          <div class="cbd-menu-row" data-item="album">
            <div class="cbd-menu-ic"><svg width="24" height="21" viewBox="0 0 24 21" fill="none" stroke="#000" stroke-width="1.5" stroke-linejoin="round"><rect x="1.2" y="1.2" width="21.6" height="18.6" rx="3.2"/><circle cx="8.2" cy="7.7" r="2"/><path d="m4 16.8 5.5-5.3 4.4 3.9 3.8-3.2 4.7 4.2" stroke-linecap="round"/></svg></div>
            <b>相册</b>
          </div>
          <div class="cbd-menu-row" data-item="file">
            <div class="cbd-menu-ic"><svg width="23" height="25" viewBox="0 0 23 25" fill="none" stroke="#000" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20.4 11.4 11.2 20.6a5.6 5.6 0 0 1-7.9-7.9L12.5 3.5a3.7 3.7 0 0 1 5.3 5.3L8.7 17.9a1.9 1.9 0 0 1-2.6-2.6l8.5-8.5"/></svg></div>
            <b>文件</b>
          </div>
        </div>

        <div class="cbd-home"></div>
        <div class="cbd-tap" id="cbdTap"></div>
      </div>
    </div>
  </div>
</div>

<script>
(function () {
  "use strict";

  var root    = document.getElementById("cbdRoot");
  var stage   = document.getElementById("cbdStage");
  var phone   = document.getElementById("cbdPhone");
  var chat    = document.getElementById("cbdChat");
  var scroll  = document.getElementById("cbdScroll");
  var chips   = document.getElementById("cbdChips");
  var dock    = document.querySelector(".cbd-dock");
  var swap    = document.getElementById("cbdSwap");
  var bar     = document.getElementById("cbdBar");
  var field   = document.getElementById("cbdField");
  var caret   = document.getElementById("cbdCaret");
  var send    = document.getElementById("cbdSend");
  var voiceRow= document.getElementById("cbdVoiceRow");
  var wave    = document.getElementById("cbdWave");
  var kb      = document.getElementById("cbdKb");
  var kbSpace = document.getElementById("cbdKbSpacer");
  var menu    = document.getElementById("cbdMenu");
  var tapDot  = document.getElementById("cbdTap");
  var screenEl= document.getElementById("cbdScreen");

  /* ---------- scale phone to wrapper width ----------
     BTN_PAD leaves room on both sides for the physical side buttons, which
     poke ~4px past the rim and would otherwise be clipped by the wrapper. */
  var DW = 424, DH = 874, BTN_PAD = 5;
  function fit() {
    var s = (root.clientWidth - BTN_PAD * 2) / DW;
    phone.style.left = BTN_PAD + "px";
    phone.style.transform = "scale(" + s + ")";
    stage.style.height = (DH * s) + "px";
  }
  fit();
  if (window.ResizeObserver) new ResizeObserver(fit).observe(root);
  else window.addEventListener("resize", fit);

  /* ---------- static bits: keyboard keys, waveform bars ---------- */
  document.querySelectorAll(".cbd-kb-row[data-row], .cbd-keys-mid[data-row]").forEach(function (row) {
    row.dataset.row.split("").forEach(function (ch) {
      var k = document.createElement("div");
      k.className = "cbd-key";
      k.textContent = ch;
      row.appendChild(k);
    });
  });
  /* waveform heights follow the Figma pattern (8–22px, 3px bars, 3px gaps) */
  var WAVE_H = [8,8,8,12,20,9,15,14,22,10,18,8,16,12,20,9,15,14,22,10,18,8,16,12,20,9,15,14,22,10,18,8,16,12];
  WAVE_H.forEach(function (h, i) {
    var bar = document.createElement("i");
    bar.style.height = h + "px";
    bar.style.animationDelay = (i * -87) + "ms";
    bar.style.animationDuration = (760 + (i * 53) % 420) + "ms";
    wave.appendChild(bar);
  });

  /* ---------- content ---------- */
  var Q1 = "帮我写《母亲》第三章的开头，从她灶台前的背影写起，克制一点，别煽情。";
  var A1 = [
    "天还没大亮，灶膛里的火把她的影子投在墙上，忽明忽暗。她往锅里添水，动作很轻，像是怕惊动什么。",
    "我没有出声，看着她被火光描出的侧脸，忽然觉得，有些话这一辈子大概都不会说出口了。"
  ];
  var Q2 = "好一些了。把第二段改成她终于开口，但只说了句家常话。";
  var A2 = [
    A1[0],
    "水开的时候，她终于开了口，声音不高：“灶上有粥，走前喝一碗。”说完就没有下文了，只有火星偶尔哔剥一声。"
  ];

  var SPARK = '<svg width="15" height="15" viewBox="0 0 15 15" fill="#C8392E"><path d="M7.5 1c.55 3.6 2.75 5.85 6.9 6.9-4.15 1.05-6.35 3.3-6.9 6.9C6.95 11.2 4.75 8.95.6 7.9 4.75 6.85 6.95 4.6 7.5 1Z"/></svg>';
  var ICONS = {
    copy:  '<svg width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="#8A8A8E" stroke-width="1.5" stroke-linejoin="round"><rect x="1.2" y="4.8" width="12" height="12" rx="2.4"/><path d="M4.8 4.8v-1.6a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2h-1.6"/></svg>',
    sound: '<svg width="20" height="16" viewBox="0 0 20 16" fill="none" stroke="#8A8A8E" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M1.2 5.6h2.8L8.6 1.5v13L4 10.4H1.2Z"/><path d="M12 4.9a4.4 4.4 0 0 1 0 6.2"/><path d="M15 2.3a8 8 0 0 1 0 11.4"/></svg>',
    up:    '<svg width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="#8A8A8E" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5.2 8.3 9.2 1.4c1.25 0 2.1.95 2.1 2.1v3.3h3.8a1.9 1.9 0 0 1 1.9 2.3l-1.05 5.2a2.5 2.5 0 0 1-2.45 2H5.2m0-8v8m0-8H1.4v8h3.8"/></svg>',
    down:  '<svg width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="#8A8A8E" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" style="transform:rotate(180deg)"><path d="M5.2 8.3 9.2 1.4c1.25 0 2.1.95 2.1 2.1v3.3h3.8a1.9 1.9 0 0 1 1.9 2.3l-1.05 5.2a2.5 2.5 0 0 1-2.45 2H5.2m0-8v8m0-8H1.4v8h3.8"/></svg>',
    frame: '<svg width="15" height="15" viewBox="0 0 15 15" fill="none" stroke="#3a3a3e" stroke-width="1.3" stroke-linejoin="round"><rect x="1.2" y="1.2" width="12.6" height="12.6" rx="2.4"/><path d="M7.5 1.2v12.6M1.2 6h6.3"/></svg>',
    map:   '<svg width="16" height="15" viewBox="0 0 16 15" fill="none" stroke="#3a3a3e" stroke-width="1.3" stroke-linecap="round"><circle cx="3" cy="7.5" r="1.8"/><circle cx="12.6" cy="2.6" r="1.7"/><circle cx="12.6" cy="12.4" r="1.7"/><path d="M4.8 6.6 11 3.3M4.8 8.4l6.2 3.3"/></svg>',
    list:  '<svg width="15" height="13" viewBox="0 0 15 13" fill="none" stroke="#3a3a3e" stroke-width="1.3" stroke-linecap="round"><path d="M5 1.5h9M5 6.5h9M5 11.5h9"/><path d="M1.2 1.5h.7M1.2 6.5h.7M1.2 11.5h.7" stroke-width="1.7"/></svg>',
    img:   '<svg width="16" height="14" viewBox="0 0 16 14" fill="none" stroke="#757575" stroke-width="1.3" stroke-linejoin="round"><rect x="1" y="1" width="14" height="12" rx="2.2"/><circle cx="5.4" cy="5" r="1.3"/><path d="m2.8 11 3.6-3.4 3 2.6 2.5-2.1 3.1 2.7" stroke-linecap="round"/></svg>',
    zoom:  '<svg width="15" height="15" viewBox="0 0 15 15" fill="none" stroke="#757575" stroke-width="1.3" stroke-linecap="round"><circle cx="6.4" cy="6.4" r="5"/><path d="m10.2 10.2 3.4 3.4M4.4 6.4h4M6.4 4.4v4"/></svg>',
    eye:   '<svg width="17" height="12" viewBox="0 0 17 12" fill="none" stroke="#757575" stroke-width="1.3" stroke-linejoin="round"><path d="M1.2 6C2.9 2.8 5.6 1 8.5 1s5.6 1.8 7.3 5c-1.7 3.2-4.4 5-7.3 5S2.9 9.2 1.2 6Z"/><circle cx="8.5" cy="6" r="2.2"/></svg>'
  };
  var CHIPS_SUGGEST = [["frame","写个框架"],["map","画思维导图"],["list","梳理思路"]];
  var CHIPS_IMAGE   = [["img","把图变为封面"],["zoom","分析这张图"],["eye","看图写话"]];

  /* ---------- tiny helpers ---------- */
  var running = true, gate = /nogate/.test(location.search);
  if (!gate && "IntersectionObserver" in window) {
    new IntersectionObserver(function (e) { running = e[0].isIntersecting; }, { threshold: 0.05 }).observe(root);
  }
  function sleep(ms) {
    return new Promise(function (res) {
      var left = ms;
      var iv = setInterval(function () {
        if (!running) return;             /* pause while offscreen */
        left -= 50;
        if (left <= 0) { clearInterval(iv); res(); }
      }, 50);
    });
  }
  function pin() { scroll.scrollTop = scroll.scrollHeight; }
  function pinFor(ms) {
    var t0 = performance.now();
    (function loop() { pin(); if (performance.now() - t0 < ms) requestAnimationFrame(loop); })();
  }
  function tapAt(el, dx, dy) {
    /* show the tap dot over an element (coords in unscaled screen space) */
    var r = el.getBoundingClientRect(), s = screenEl.getBoundingClientRect();
    var scale = s.width / screenEl.offsetWidth;
    tapDot.style.left = ((r.left - s.left) / scale + (dx == null ? r.width / (2 * scale) : dx)) + "px";
    tapDot.style.top  = ((r.top  - s.top)  / scale + (dy == null ? r.height / (2 * scale) : dy)) + "px";
    tapDot.classList.remove("cbd-on");
    void tapDot.offsetWidth;
    tapDot.classList.add("cbd-on");
    return sleep(360);
  }
  function stream(el, text, msPerTick, charsPerTick) {
    return new Promise(function (res) {
      var i = 0;
      var iv = setInterval(function () {
        if (!running) return;
        i += charsPerTick;
        el.textContent = text.slice(0, i);
        pin();
        if (i >= text.length) { clearInterval(iv); res(); }
      }, msPerTick);
    });
  }
  function setChips(list) {
    chips.innerHTML = "";
    list.forEach(function (c, i) {
      var d = document.createElement("div");
      d.className = "cbd-chip";
      d.style.animationDelay = (i * 60) + "ms";
      d.innerHTML = ICONS[c[0]] + "<span>" + c[1] + "</span>";
      chips.appendChild(d);
    });
  }

  /* ---------- message builders ---------- */
  function addUser(text) {
    var b = document.createElement("div");
    b.className = "cbd-bubble cbd-msg-in";
    b.textContent = text;
    scroll.appendChild(b);
    pin();
    return b;
  }
  function addAI() {
    var w = document.createElement("div");
    w.className = "cbd-ai cbd-msg-in";
    w.innerHTML =
      '<div class="cbd-ailabel"><span class="cbd-spark"><span class="cbd-think"><i></i><i></i><i></i></span></span><span class="cbd-lab">思考中…</span></div>' +
      '<div class="cbd-skel"><i style="width:96%"></i><i style="width:88%"></i><i style="width:79%"></i><i style="width:55%"></i></div>' +
      '<div class="cbd-paras"><p></p><p></p></div>' +
      '<div class="cbd-acts">' + ICONS.copy + ICONS.sound + ICONS.up + ICONS.down + "</div>";
    scroll.appendChild(w);
    pin();
    return {
      el: w,
      label: w.querySelector(".cbd-lab"),
      spark: w.querySelector(".cbd-spark"),
      skel:  w.querySelector(".cbd-skel"),
      paras: w.querySelectorAll(".cbd-paras p"),
      acts:  w.querySelector(".cbd-acts")
    };
  }
  function aiDone(ai) {
    ai.spark.innerHTML = SPARK;
    ai.label.textContent = "书稿已生成";
    ai.skel.classList.add("cbd-gone");
  }

  /* ---------- input helpers ---------- */
  function fieldReset() {
    field.classList.remove("cbd-filled");
    field.childNodes[0].nodeValue = "写点什么…";
    caret.classList.remove("cbd-on");
    send.classList.remove("cbd-on");
  }
  function typeInto(text, ms) {
    field.classList.add("cbd-filled");
    field.childNodes[0].nodeValue = "";
    caret.classList.add("cbd-on");
    var keys = Array.prototype.slice.call(kb.querySelectorAll(".cbd-key:not(.cbd-key-fn)"));
    return new Promise(function (res) {
      var i = 0;
      var iv = setInterval(function () {
        if (!running) return;
        i++;
        field.childNodes[0].nodeValue = text.slice(0, i);
        var k = keys[Math.floor(Math.random() * keys.length)];
        k.classList.add("cbd-hit");
        setTimeout(function () { k.classList.remove("cbd-hit"); }, 90);
        if (i === 2) send.classList.add("cbd-on");
        if (i >= text.length) { clearInterval(iv); res(); }
      }, ms);
    });
  }

  /* ---------- initial state ---------- */
  var ai1;
  function baseState() {
    scroll.innerHTML = "";
    addUser(Q1);
    ai1 = addAI();
    setChips(CHIPS_SUGGEST);
    dock.classList.remove("cbd-hidechips");
    bar.classList.remove("cbd-expanded");
    swap.classList.remove("cbd-recording");
    voiceRow.classList.remove("cbd-on");
    menu.classList.remove("cbd-open");
    kb.classList.remove("cbd-open");
    kbSpace.classList.remove("cbd-open");
    fieldReset();
    scroll.scrollTop = 0;
  }

  /* ---------- the loop ---------- */
  async function run() {
    baseState();

    for (;;) {
      /* 0–1.5s  thinking */
      await sleep(1600);

      /* 1.5–3.5s  answer streams in */
      aiDone(ai1);
      await sleep(380);
      await stream(ai1.paras[0], A1[0], 50, 2);
      await sleep(180);
      await stream(ai1.paras[1], A1[1], 50, 2);
      ai1.acts.classList.add("cbd-on");
      pin();
      await sleep(900);

      /* 3.5–5s  open keyboard, type, send */
      await tapAt(field);
      dock.classList.add("cbd-hidechips");
      kb.classList.add("cbd-open");
      kbSpace.classList.add("cbd-open");
      pinFor(450);
      await sleep(480);
      await typeInto(Q2, 52);
      await sleep(350);
      await tapAt(send);

      /* 5–7s  keyboard down, message lands, AI thinks again, new answer */
      kb.classList.remove("cbd-open");
      kbSpace.classList.remove("cbd-open");
      fieldReset();
      pinFor(450);
      setTimeout(function () { dock.classList.remove("cbd-hidechips"); }, 400);
      addUser(Q2);
      await sleep(500);
      var ai2 = addAI();
      ai2.skel.querySelectorAll("i")[2].remove();
      ai2.skel.querySelectorAll("i")[2].remove();
      await sleep(1300);
      aiDone(ai2);
      await sleep(380);
      await stream(ai2.paras[0], A2[0], 44, 2);
      await sleep(160);
      await stream(ai2.paras[1], A2[1], 44, 2);
      ai2.acts.classList.add("cbd-on");
      pin();
      await sleep(1000);

      /* 7–9s  plus → menu → pick album → image lands inside the input card */
      await tapAt(document.getElementById("cbdPlus"));
      menu.classList.add("cbd-open");
      await sleep(950);
      var albumRow = menu.querySelector('[data-item="album"]');
      await tapAt(albumRow);
      albumRow.classList.add("cbd-hit");
      await sleep(240);
      albumRow.classList.remove("cbd-hit");
      menu.classList.remove("cbd-open");
      await sleep(400);
      bar.classList.add("cbd-expanded");
      setChips(CHIPS_IMAGE);
      send.classList.add("cbd-on");
      await sleep(1750);

      /* 9–11s  remove image, switch to voice */
      await tapAt(document.getElementById("cbdThumb"), 58, 13);
      bar.classList.remove("cbd-expanded");
      setChips(CHIPS_SUGGEST);
      send.classList.remove("cbd-on");
      await sleep(650);
      await tapAt(document.getElementById("cbdVoiceBtn"));
      swap.classList.add("cbd-recording");
      voiceRow.classList.add("cbd-on");
      await sleep(2300);

      /* 11–13s  stop recording, settle, then reset for a seamless loop */
      await tapAt(swap.querySelector(".cbd-stopbtn"));
      swap.classList.remove("cbd-recording");
      voiceRow.classList.remove("cbd-on");
      await sleep(1200);

      chat.classList.add("cbd-fade");
      await sleep(500);
      baseState();
      chat.classList.remove("cbd-fade");
      await sleep(150);
    }
  }

  if (window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches) {
    /* honour reduced motion: render the finished first answer, no loop */
    baseState();
    aiDone(ai1);
    ai1.paras[0].textContent = A1[0];
    ai1.paras[1].textContent = A1[1];
    ai1.acts.classList.add("cbd-on");
  } else {
    run();
  }
})();
</script>
</body>
</html>
